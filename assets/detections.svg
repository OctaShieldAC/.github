<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="feed-title feed-desc">
  <title id="feed-title">OCTA Shield - live detection feed</title>
  <desc id="feed-desc">Illustrative detection pipeline: detect, correlate, sanction, seal evidence.</desc>
  <defs>
    <clipPath id="panel"><rect width="1200" height="340" rx="20"/></clipPath>
    <linearGradient id="rail" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#F43D16" stop-opacity=".9"/>
      <stop offset="1" stop-color="#F43D16" stop-opacity=".15"/>
    </linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
      .sans { font-family: Unageo, Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .ln { animation: feed 12s ease both infinite; }
      .cur { animation: blink 1s steps(1) infinite; }
      .stage { animation: stage 12s ease both infinite; }
      @keyframes feed { 0% { opacity: 0; transform: translateY(8px); } 4% { opacity: 1; transform: none; } 86% { opacity: 1; } 94% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes stage { 0%, 2% { opacity: .35; } 6%, 86% { opacity: 1; } 94%, 100% { opacity: .35; } }
      .t { fill: #5E5E5E; }
      .tag { font-weight: 700; }
      .msg { fill: #F3F3F3; }
      .dim { fill: #8D8D8D; }
      .hi { fill: #FF7658; }
      .crit { fill: #F43D16; }
    </style>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="1200" height="340" fill="#0A0A0A"/>

    <!-- Title bar -->
    <rect width="1200" height="44" fill="#111111"/>
    <line x1="0" x2="1200" y1="44.5" y2="44.5" stroke="#F3F3F3" stroke-opacity=".08"/>
    <circle cx="24" cy="22" r="5" fill="#F43D16"/>
    <circle cx="42" cy="22" r="5" fill="#3A3A3A"/>
    <circle cx="60" cy="22" r="5" fill="#3A3A3A"/>
    <text class="mono dim" x="84" y="26.5" letter-spacing=".5">octa-shield  ·  live detection feed</text>
    <text class="mono dim" x="1176" y="26.5" text-anchor="end" letter-spacing=".5">fps impact 0  ·  tick degradation 0</text>

    <!-- Feed -->
    <g class="mono" transform="translate(28 0)">
      <g class="ln" style="animation-delay:.3s">
        <text y="80"><tspan class="t">[00:00:00.000]</tspan><tspan class="tag dim" x="118">BOOT</tspan><tspan class="msg" x="190">engine attached  ·  async kernel routines  ·  integrity baseline sealed</tspan></text>
      </g>
      <g class="ln" style="animation-delay:1.1s">
        <text y="108"><tspan class="t">[00:00:01.214]</tspan><tspan class="tag dim" x="118">SCAN</tspan><tspan class="msg" x="190">memory-space  ·  loaded modules 212  ·  threads 48</tspan><tspan class="dim" x="700">OK</tspan></text>
      </g>
      <g class="ln" style="animation-delay:1.9s">
        <text y="136"><tspan class="t">[00:00:02.047]</tspan><tspan class="tag crit" x="118">DETECT</tspan><tspan class="msg" x="190">code-injection  ·  vector=manual-map  ·  module=unsigned</tspan><tspan class="hi" x="700">HIGH</tspan></text>
      </g>
      <g class="ln" style="animation-delay:2.7s">
        <text y="164"><tspan class="t">[00:00:02.051]</tspan><tspan class="tag hi" x="118">ACTION</tspan><tspan class="msg" x="190">policy=auto  →  session terminated  ·  evidence captured</tspan></text>
      </g>
      <g class="ln" style="animation-delay:3.5s">
        <text y="192"><tspan class="t">[00:00:03.380]</tspan><tspan class="tag crit" x="118">DETECT</tspan><tspan class="msg" x="190">dma/pcie  ·  unauthorized device  ·  masked vendor-id</tspan><tspan class="crit" x="700">CRITICAL</tspan></text>
      </g>
      <g class="ln" style="animation-delay:4.3s">
        <text y="220"><tspan class="t">[00:00:03.902]</tspan><tspan class="tag hi" x="118">HEUR</tspan><tspan class="msg" x="190">input-pattern  ·  reaction 38ms  ·  entropy 0.02  ·  human-likelihood LOW</tspan><tspan class="hi" x="700">MEDIUM</tspan></text>
      </g>
      <g class="ln" style="animation-delay:5.1s">
        <text y="248"><tspan class="t">[00:00:04.510]</tspan><tspan class="tag msg" x="118">AUDIT</tspan><tspan class="msg" x="190">incident #A1-48213  ·  sha256 ✓  ·  timestamp ✓  ·  chain ✓  →  dashboard</tspan></text>
      </g>
      <g class="ln" style="animation-delay:5.9s">
        <text y="276"><tspan class="t">[00:00:05.000]</tspan><tspan class="tag dim" x="118">STATUS</tspan><tspan class="dim" x="190">false-positive guard active  ·  5M+ players shielded  ·  monitoring 24/7</tspan></text>
      </g>
      <g class="ln" style="animation-delay:6.4s">
        <text y="304"><tspan class="crit">❯</tspan></text>
        <rect class="cur" x="18" y="293" width="7" height="14" fill="#F43D16"/>
      </g>
    </g>

    <!-- Pipeline -->
    <line x1="808" x2="808" y1="44" y2="340" stroke="#F3F3F3" stroke-opacity=".08"/>
    <g transform="translate(840 0)">
      <text class="mono dim" x="0" y="76" letter-spacing="2.4" font-size="10">PIPELINE</text>

      <line x1="9" x2="9" y1="100" y2="300" stroke="url(#rail)" stroke-width="2"/>
      <circle r="4" fill="#FF7658">
        <animateMotion dur="3s" repeatCount="indefinite" path="M9 100 L9 300"/>
      </circle>

      <g class="stage" style="animation-delay:1.9s">
        <circle cx="9" cy="104" r="5" fill="#0A0A0A" stroke="#F43D16" stroke-width="2"/>
        <text class="sans" x="30" y="100" font-size="14" font-weight="600" fill="#F3F3F3">Detect</text>
        <text class="sans dim" x="30" y="118" font-size="12">memory  ·  DMA hardware  ·  injection</text>
      </g>
      <g class="stage" style="animation-delay:2.5s">
        <circle cx="9" cy="168" r="5" fill="#0A0A0A" stroke="#F43D16" stroke-width="2"/>
        <text class="sans" x="30" y="164" font-size="14" font-weight="600" fill="#F3F3F3">Correlate</text>
        <text class="sans dim" x="30" y="182" font-size="12">telemetry history  ·  behavioral heuristics  ·  AI</text>
      </g>
      <g class="stage" style="animation-delay:3.1s">
        <circle cx="9" cy="232" r="5" fill="#0A0A0A" stroke="#F43D16" stroke-width="2"/>
        <text class="sans" x="30" y="228" font-size="14" font-weight="600" fill="#F3F3F3">Sanction</text>
        <text class="sans dim" x="30" y="246" font-size="12">policy-driven  ·  real time  ·  no human lag</text>
      </g>
      <g class="stage" style="animation-delay:5.1s">
        <circle cx="9" cy="296" r="5" fill="#0A0A0A" stroke="#F43D16" stroke-width="2"/>
        <text class="sans" x="30" y="292" font-size="14" font-weight="600" fill="#F3F3F3">Seal evidence</text>
        <text class="sans dim" x="30" y="310" font-size="12">hashed  ·  timestamped  ·  court-ready</text>
      </g>
    </g>

    <rect x=".5" y=".5" width="1199" height="339" rx="19.5" fill="none" stroke="#F3F3F3" stroke-opacity=".12"/>
  </g>
</svg>

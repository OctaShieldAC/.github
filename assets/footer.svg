<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="footer-title">
  <title id="footer-title">Protect your community before the next threat arrives.</title>
  <defs>
    <clipPath id="frame"><rect width="1200" height="250" rx="28"/></clipPath>
    <linearGradient id="wm" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#F3F3F3" stop-opacity=".16"/>
      <stop offset="1" stop-color="#F3F3F3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#F94C2B"/>
      <stop offset="1" stop-color="#FF2B51"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
